name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Publish as Draft'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Publish as Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run test suite
        run: cargo test --release --verbose

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package artifacts & generate checksums
        shell: pwsh
        run: |
          $targetDir = "target/x86_64-pc-windows-msvc/release"
          $binPath = Join-Path $targetDir "sidebar-native.exe"
          $archiveName = "sidebar-native-windows-x86_64.zip"
          $archivePath = Join-Path $targetDir $archiveName

          if (-not (Test-Path $binPath)) {
            Write-Error "Binary not found at $binPath"
            exit 1
          }

          Write-Host "Creating zip archive: $archivePath"
          Compress-Archive -Path $binPath -DestinationPath $archivePath -Force

          Write-Host "Generating SHA256 checksum..."
          $hash = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLower()
          $hashFile = "$archivePath.sha256"
          Set-Content -Path $hashFile -Value "$hash  $archiveName" -Encoding Ascii

          Write-Host "Artifacts packaged successfully:"
          Get-ChildItem -Path $targetDir -Filter "sidebar-native-windows-x86_64*" | Format-Table Name, Length

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sidebar-native-windows-x86_64
          path: |
            target/x86_64-pc-windows-msvc/release/sidebar-native-windows-x86_64.zip
            target/x86_64-pc-windows-msvc/release/sidebar-native-windows-x86_64.zip.sha256
            target/x86_64-pc-windows-msvc/release/sidebar-native.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/x86_64-pc-windows-msvc/release/sidebar-native-windows-x86_64.zip
            target/x86_64-pc-windows-msvc/release/sidebar-native-windows-x86_64.zip.sha256
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

